substitutions:
  _REGION: us-central1
  _REPOSITORY: health-data-pipeline
  _IMAGE: health-data-pipeline
  _TF_STATE_BUCKET: ""
  _HEALTH_BUCKET_NAME: ""
  _NOTIFICATION_EMAIL: ""
  _NOTION_DATA_SOURCE_ID: ""
  _BILLING_ACCOUNT_ID: ""
  _BILLING_CURRENCY_CODE: USD
  _MONTHLY_BUDGET_AMOUNT: "5"
  _GITHUB_REPOSITORY: ""
  _GITHUB_REPOSITORY_ID: ""
  _SCHEDULER_PAUSED: "true"
  _ALLOW_SCHEDULER_RESUME: "false"
  _DEPLOY: "false"

steps:
  - id: docker-test-stage
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target
      - test
      - --tag
      - health-data-pipeline:test-${BUILD_ID}
      - .

  - id: docker-runtime-stage
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target
      - runtime
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BUILD_ID}
      - .
    waitFor:
      - docker-test-stage

  - id: trivy-runtime-image
    name: aquasec/trivy:0.64.1
    entrypoint: trivy
    args:
      - image
      - --exit-code
      - "1"
      - --ignore-unfixed
      - --severity
      - CRITICAL,HIGH
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BUILD_ID}
    waitFor:
      - docker-runtime-stage

  - id: push-runtime-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BUILD_ID}
    waitFor:
      - trivy-runtime-image

  - id: terraform-plan
    name: hashicorp/terraform:1.12.2
    entrypoint: sh
    env:
      - TF_IN_AUTOMATION=1
    args:
      - -ceu
      - |
        if [ -z "${_TF_STATE_BUCKET}" ] || [ -z "${_HEALTH_BUCKET_NAME}" ]; then
          echo "Terraform substitutions _TF_STATE_BUCKET and _HEALTH_BUCKET_NAME are required." >&2
          exit 1
        fi

        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BUILD_ID}"
        cd infra/main
        terraform init -input=false -backend-config="bucket=${_TF_STATE_BUCKET}"
        terraform plan -input=false -out=/workspace/health-data-pipeline.tfplan \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="health_bucket_name=${_HEALTH_BUCKET_NAME}" \
          -var="terraform_state_bucket_name=${_TF_STATE_BUCKET}" \
          -var="container_image=$${IMAGE}" \
          -var="deploy_workloads=true" \
          -var="notification_email=${_NOTIFICATION_EMAIL}" \
          -var="notion_data_source_id=${_NOTION_DATA_SOURCE_ID}" \
          -var="billing_account_id=${_BILLING_ACCOUNT_ID}" \
          -var="billing_currency_code=${_BILLING_CURRENCY_CODE}" \
          -var="monthly_budget_amount=${_MONTHLY_BUDGET_AMOUNT}" \
          -var="github_repository=${_GITHUB_REPOSITORY}" \
          -var="github_repository_id=${_GITHUB_REPOSITORY_ID}" \
          -var="scheduler_paused=${_SCHEDULER_PAUSED}"

        terraform show -json /workspace/health-data-pipeline.tfplan \
          > /workspace/health-data-pipeline.tfplan.json
    waitFor:
      - push-runtime-image

  - id: scheduler-resume-guard
    name: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    entrypoint: python
    args:
      - scripts/check_scheduler_resume.py
      - /workspace/health-data-pipeline.tfplan.json
      - ${_SCHEDULER_PAUSED}
      - ${_ALLOW_SCHEDULER_RESUME}
    waitFor:
      - terraform-plan

  - id: terraform-apply
    name: hashicorp/terraform:1.12.2
    entrypoint: sh
    env:
      - TF_IN_AUTOMATION=1
    args:
      - -ceu
      - |
        cd infra/main
        if [ "${_DEPLOY}" = "true" ]; then
          terraform apply -input=false -auto-approve /workspace/health-data-pipeline.tfplan
        else
          echo "Terraform apply skipped because _DEPLOY=${_DEPLOY}."
        fi
    waitFor:
      - scheduler-resume-guard

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
